# File version: 1.0; date: 2026-05-11

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intervention-sample-planner"
version = "1.0.0"
description = "Local API and Tkinter app for planning sample sizes for two-group intervention studies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Intervention Sample Planner contributors" }
]
keywords = ["sample-size", "power-analysis", "intervention", "tkinter", "research-methods"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
intervention-sample-planner = "intervention_sample_planner.gui:main"

[tool.setuptools.packages.find]
include = ["intervention_sample_planner*"]
