name: Deploy Render on tag

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install web dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Trigger Render deploy for this tag commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import urllib.request

          hook = os.environ["RENDER_DEPLOY_HOOK_URL"]
          separator = "&" if "?" in hook else "?"
          url = f"{hook}{separator}ref={os.environ['GITHUB_SHA']}"
          request = urllib.request.Request(url, method="POST")
          with urllib.request.urlopen(request, timeout=60) as response:
              print(f"Render deploy hook returned HTTP {response.status}")
          PY
